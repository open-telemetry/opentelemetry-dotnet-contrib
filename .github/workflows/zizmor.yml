name: zizmor scan

on:
  pull_request:
  push:
    branches: [ 'main*', 'instrumentation*', 'exporter*', 'extensions*' ]
  workflow_dispatch:

permissions: {}

env:
  FORCE_COLOR: 3
  TERM: xterm

jobs:
  zizmor:
    name: Zizmor Security Analysis
    permissions:
      contents: read
      security-events: write # for zizmor to upload SARIF results
    uses: open-telemetry/shared-workflows/.github/workflows/zizmor.yml@22c6d43ead71f463aa2b16ddb7081e94d2ad6a0e # v0.26.0
    with:
      persona: pedantic
